; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:nucleo_f429zi]
platform = ststm32
board = nucleo_f429zi
; framework =
platform_packages =
  toolchain-gccarmnoneeabi@^1.140201.0


board_build.ldscript = linker/STM32F429ZITX_FLASH.ld

build_flags =
  -DSTM32F429xx
  -Iframework/CMSIS_CORE/Include
  -Iframework/CMSIS_STM32F4xx/Include
  -Wl,-Map,firmware.map
  -fno-unwind-tables
  -fno-asynchronous-unwind-tables


build_src_filter =
  +<*>
  +<../startup/*>
  +<../framework/CMSIS_STM32F4xx/Source/Templates/system_stm32f4xx.c>
  -<../framework/**>
  
debug_build_flags = -g

monitor_speed = 115200